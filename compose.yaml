services:
  xiuxian:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATA_DIR: /app/server/data
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?Configure MCP_ALLOWED_HOSTS in .env first}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
      REGISTRATION_OPEN: "${REGISTRATION_OPEN:-false}"
    volumes:
      - xiuxian-data:/app/server/data
    restart: unless-stopped
volumes:
  xiuxian-data:
